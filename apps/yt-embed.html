<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yt-embed</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #09090b;
    color: #e4e4e7;
    font-family: system-ui, sans-serif;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 1.5rem;
  }
  .container {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }
  .subtitle {
    color: #71717a;
    font-size: 0.8rem;
    margin-bottom: 1.25rem;
  }
  .input-group {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .input-group input {
    flex: 1;
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 0.5rem;
    padding: 0.65rem 0.85rem;
    color: #e4e4e7;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .input-group input:focus {
    border-color: #6366f1;
  }
  .input-group input::placeholder {
    color: #52525b;
  }
  .player-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #18181b;
    border-radius: 0.75rem;
    overflow: hidden;
    margin-bottom: 1rem;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  .player-wrap #player,
  .player-wrap #player iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .player-wrap #player {
    position: absolute;
    inset: 0;
  }
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #52525b;
    font-size: 0.9rem;
    gap: 0.75rem;
  }
  .placeholder svg {
    opacity: 0.4;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1rem;
    align-items: center;
  }
  .toggle {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    color: #a1a1aa;
    cursor: pointer;
    user-select: none;
  }
  .toggle input {
    display: none;
  }
  .toggle .slider {
    position: relative;
    width: 36px;
    height: 20px;
    background: #27272a;
    border-radius: 10px;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle .slider::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 14px;
    height: 14px;
    background: #71717a;
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle input:checked + .slider {
    background: #6366f1;
  }
  .toggle input:checked + .slider::after {
    transform: translateX(16px);
    background: #fff;
  }
  .btn {
    background: #18181b;
    border: 1px solid #27272a;
    color: #e4e4e7;
    font-family: inherit;
    font-size: 0.85rem;
    padding: 0.55rem 1rem;
    border-radius: 0.5rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .btn:hover {
    background: #27272a;
    border-color: #3f3f46;
  }
  .btn:active {
    background: #3f3f46;
  }
  .foot {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-top: 0.5rem;
    align-items: center;
  }
  a.back {
    color: #a1a1aa;
    font-size: 0.875rem;
    text-decoration: none;
    transition: color 0.15s;
  }
  a.back:hover {
    color: #e4e4e7;
  }
  .created {
    color: #52525b;
    font-size: 0.75rem;
  }
  /* Theatre mode */
  .container.theatre {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    max-width: none;
    z-index: 9999;
    padding: 0;
    background: #09090b;
    display: flex;
    flex-direction: column;
    transition: all 0.3s ease;
  }
  .container.theatre h1,
  .container.theatre .subtitle {
    display: none;
  }
  .container.theatre .input-group {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: 0.75rem 1rem;
    margin: 0;
    border: none;
    background: linear-gradient(rgba(9,9,11,0.92) 0%, transparent 100%);
  }
  .container.theatre .player-wrap {
    flex: 1;
    width: 100%;
    aspect-ratio: unset;
    border-radius: 0;
    margin: 0;
    box-shadow: none;
    transition: all 0.3s ease;
  }
  .container.theatre .controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    margin: 0;
    padding: 1.5rem;
    background: linear-gradient(transparent 0%, rgba(9,9,11,0.9) 40%);
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
    border-radius: 0;
  }
  .container.theatre .foot {
    display: none;
  }
  /* Theatre mode — auto-hide controls */
  .container.theatre .input-group,
  .container.theatre .controls {
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .container.theatre.controls-hidden .input-group {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-10px);
  }
  .container.theatre.controls-hidden .controls {
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
  }
  @media (max-width: 480px) {
    body { padding: 1rem; }
    .controls { gap: 0.5rem; }
    .btn { padding: 0.5rem 0.75rem; }
    .container.theatre { padding: 0; }
    .container.theatre .input-group { padding: 0.5rem 0.75rem; }
    .container.theatre .controls {
      padding: 0.75rem;
      gap: 0.5rem;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h1>YouTube Clean Player</h1>
  <p class="subtitle">Paste a YouTube link — get a chrome-free embed</p>

  <div class="input-group">
    <input type="text" id="urlInput" placeholder="https://youtube.com/watch?v=..." spellcheck="false">
  </div>

  <div class="player-wrap" id="playerWrap">
    <div class="placeholder" id="placeholder">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span>Paste a YouTube URL above</span>
    </div>
    <div id="player" style="display:none"></div>
  </div>

  <div class="controls">
    <label class="toggle">
      <input type="checkbox" id="autoplayToggle">
      <span class="slider"></span>
      autoplay
    </label>
    <label class="toggle">
      <input type="checkbox" id="controlsToggle" checked>
      <span class="slider"></span>
      controls
    </label>
    <label class="toggle">
      <input type="checkbox" id="loopToggle">
      <span class="slider"></span>
      loop
    </label>
    <button class="btn" id="theatreBtn">□ Theatre</button>
  </div>

  <div class="foot">
    <a class="back" href="/apps/">back</a>
    <span class="created">created 2026-07-29</span>
  </div>
</div>

<script>
(function() {
  'use strict';

  // --- DOM refs ---
  const urlInput    = document.getElementById('urlInput');
  const playerDiv   = document.getElementById('player');
  const placeholder = document.getElementById('placeholder');
  const autoplayCb  = document.getElementById('autoplayToggle');
  const controlsCb  = document.getElementById('controlsToggle');
  const loopCb      = document.getElementById('loopToggle');
  const theatreBtn  = document.getElementById('theatreBtn');
  const container   = document.querySelector('.container');

  // --- State ---
  let player = null;
  let currentVideoId = '';
  let syncInterval = null;
  let ytApiReady = false;
  let pendingCreate = null;
  const STORAGE_KEY = 'yt-embed-state';

  // --- YT IFrame API bootstrap ---
  window.onYouTubeIframeAPIReady = function() {
    ytApiReady = true;
    if (pendingCreate) {
      const fn = pendingCreate;
      pendingCreate = null;
      fn();
    }
  };

  (function loadYTAPI() {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    const first = document.getElementsByTagName('script')[0];
    first.parentNode.insertBefore(tag, first);
  })();

  // --- URL helpers (history.replaceState — no history pollution) ---
  function getUrlParams() {
    const p = new URLSearchParams(window.location.search);
    const v = p.get('v');
    const t = parseInt(p.get('t'), 10);
    return { videoId: v || null, time: isNaN(t) ? 0 : t };
  }

  function updateUrl(videoId, time) {
    const p = new URLSearchParams();
    if (videoId) {
      p.set('v', videoId);
      p.set('t', String(Math.floor(time)));
    }
    const qs = p.toString();
    history.replaceState(null, '', qs ? '?' + qs : window.location.pathname);
  }

  // --- Video ID extraction ---
  function extractVideoId(str) {
    if (!str) return null;
    const s = str.trim();
    let m = s.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    m = s.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    m = s.match(/youtube\.com\/watch\?(?:.*&)?v=([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    m = s.match(/^([a-zA-Z0-9_-]{11})$/);
    if (m) return m[1];
    return null;
  }

  function extractStartTime(str) {
    if (!str) return 0;
    const m = str.trim().match(/[?&]t=(\d+)/);
    return m ? parseInt(m[1], 10) : 0;
  }

  // --- URL time sync ---
  function startSync() {
    stopSync();
    syncInterval = setInterval(() => {
      if (!player || document.hidden) return;
      try {
        if (player.getPlayerState() === YT.PlayerState.PLAYING) {
          updateUrl(currentVideoId, Math.floor(player.getCurrentTime()));
        }
      } catch(e) { /* player disposed during tick */ }
    }, 1000);
  }

  function stopSync() {
    if (syncInterval) {
      clearInterval(syncInterval);
      syncInterval = null;
    }
  }

  // --- Player management ---
  function createPlayer(videoId, startSeconds) {
    if (!ytApiReady) {
      pendingCreate = () => createPlayer(videoId, startSeconds);
      return;
    }

    if (player) {
      player.destroy();
      player = null;
    }

    const vars = {
      origin: window.location.origin,
      rel: 0,
      modestbranding: 1,
    };
    if (autoplayCb.checked) vars.autoplay = 1;
    if (controlsCb.checked) vars.controls = 1;
    else vars.controls = 0;
    if (loopCb.checked) {
      vars.loop = 1;
      vars.playlist = videoId;
    }

    player = new YT.Player('player', {
      height: '100%',
      width: '100%',
      videoId: videoId,
      playerVars: vars,
      events: {
        onReady: () => {
          if (startSeconds > 0) {
            player.seekTo(startSeconds, true);
          }
          placeholder.style.display = 'none';
          playerDiv.style.display = '';
          startSync();
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.ENDED) {
            stopSync();
          }
        },
      },
    });
  }

  function loadPlayer(videoId, startSeconds) {
    if (!videoId) { unloadPlayer(); return; }

    if (videoId !== currentVideoId) {
      currentVideoId = videoId;
      updateUrl(videoId, startSeconds);
    }
    placeholder.style.display = 'none';
    stopSync();
    createPlayer(videoId, startSeconds);
  }

  function unloadPlayer() {
    stopSync();
    if (player) {
      player.destroy();
      player = null;
    }
    currentVideoId = '';
    playerDiv.style.display = 'none';
    placeholder.style.display = 'flex';
    updateUrl(null, 0);
  }

  function reloadPlayer() {
    if (!currentVideoId) return;
    let startTime = 0;
    if (player) {
      try { startTime = player.getCurrentTime() || 0; } catch(e) {}
      stopSync();
      player.destroy();
      player = null;
    }
    createPlayer(currentVideoId, startTime);
  }

  // --- Input handling ---
  function handleInput() {
    const id = extractVideoId(urlInput.value);
    if (id) {
      const startTime = extractStartTime(urlInput.value);
      loadPlayer(id, startTime);
    } else {
      unloadPlayer();
    }
  }

  let inputTimer = null;
  urlInput.addEventListener('input', () => {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(handleInput, 300);
  });
  urlInput.addEventListener('paste', () => {
    setTimeout(handleInput, 50);
  });

  // --- Toggles → recreate player with new settings ---
  autoplayCb.addEventListener('change', reloadPlayer);
  controlsCb.addEventListener('change', reloadPlayer);
  loopCb.addEventListener('change', reloadPlayer);

  // --- Theatre mode + auto-hide controls ---
  let hideTimer = null;
  let hideController = null;

  function showControls() {
    container.classList.remove('controls-hidden');
    resetHideTimer();
  }

  function resetHideTimer() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      container.classList.add('controls-hidden');
    }, 3000);
  }

  function setupAutoHide() {
    hideController = new AbortController();
    const signal = hideController.signal;
    showControls();

    document.addEventListener('mousemove', () => {
      if (container.classList.contains('theatre')) showControls();
    }, { signal });
    container.addEventListener('click', (e) => {
      if (e.target.closest('.input-group, .controls')) showControls();
    }, { signal });
    container.addEventListener('input', showControls, { signal });
    container.addEventListener('focusin', (e) => {
      if (e.target.closest('.input-group, .controls')) showControls();
    }, { signal });
  }

  function cleanupAutoHide() {
    clearTimeout(hideTimer);
    container.classList.remove('controls-hidden');
    if (hideController) {
      hideController.abort();
      hideController = null;
    }
  }

  theatreBtn.addEventListener('click', () => {
    const isTheatre = container.classList.toggle('theatre');
    theatreBtn.textContent = isTheatre ? 'Exit Theatre' : '□ Theatre';
    if (isTheatre) setupAutoHide();
    else cleanupAutoHide();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && container.classList.contains('theatre')) {
      container.classList.remove('theatre');
      theatreBtn.textContent = '□ Theatre';
      cleanupAutoHide();
    }
  });

  // --- localStorage backup (beforeunload) ---
  function saveToStorage() {
    if (currentVideoId && player) {
      try {
        const t = Math.floor(player.getCurrentTime() || 0);
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ v: currentVideoId, t }));
      } catch(e) {}
    }
  }

  function restoreFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (d && d.v && /^[a-zA-Z0-9_-]{11}$/.test(d.v)) {
        return { videoId: d.v, time: d.t || 0 };
      }
    } catch(e) {}
    return null;
  }

  window.addEventListener('beforeunload', saveToStorage);

  // --- Init: URL params > localStorage > placeholder ---
  function init() {
    const { videoId, time } = getUrlParams();
    if (videoId) {
      urlInput.value = 'https://youtube.com/watch?v=' + videoId;
      loadPlayer(videoId, time);
      return;
    }
    const saved = restoreFromStorage();
    if (saved) {
      urlInput.value = 'https://youtube.com/watch?v=' + saved.videoId;
      loadPlayer(saved.videoId, saved.time);
    }
  }

  init();
})();
</script>
</body>
</html>
