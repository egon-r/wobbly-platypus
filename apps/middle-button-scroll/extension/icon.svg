<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eaed"/>
      <stop offset="100%" stop-color="#d2d5d9"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a4d52"/>
      <stop offset="100%" stop-color="#2c2e33"/>
    </linearGradient>
    <linearGradient id="arrowUp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34a853"/>
      <stop offset="100%" stop-color="#1e8e3e"/>
    </linearGradient>
    <linearGradient id="arrowDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea4335"/>
      <stop offset="100%" stop-color="#c5221f"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="62" fill="url(#bg)" stroke="#bdc1c6" stroke-width="1.5"/>

  <!-- Wheel body -->
  <rect x="42" y="18" width="44" height="92" rx="22" ry="22" fill="url(#wheel)" stroke="#1a1c1e" stroke-width="1.5"/>

  <!-- Inner highlight -->
  <rect x="44" y="20" width="40" height="88" rx="20" ry="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Grip lines -->
  <g stroke="#8a8d92" stroke-width="2.5" stroke-linecap="round">
    <line x1="50" y1="34" x2="78" y2="34"/>
    <line x1="50" y1="42" x2="78" y2="42"/>
    <line x1="50" y1="50" x2="78" y2="50"/>
    <line x1="50" y1="58" x2="78" y2="58"/>
    <line x1="50" y1="66" x2="78" y2="66"/>
    <line x1="50" y1="74" x2="78" y2="74"/>
    <line x1="50" y1="82" x2="78" y2="82"/>
    <line x1="50" y1="90" x2="78" y2="90"/>
  </g>

  <!-- Subtle grip highlight -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-linecap="round">
    <line x1="50" y1="35" x2="78" y2="35"/>
    <line x1="50" y1="43" x2="78" y2="43"/>
    <line x1="50" y1="51" x2="78" y2="51"/>
    <line x1="50" y1="59" x2="78" y2="59"/>
    <line x1="50" y1="67" x2="78" y2="67"/>
    <line x1="50" y1="75" x2="78" y2="75"/>
    <line x1="50" y1="83" x2="78" y2="83"/>
    <line x1="50" y1="91" x2="78" y2="91"/>
  </g>

  <!-- Up arrow (left of wheel) -->
  <path d="M18 60 L30 46 L42 60" fill="none" stroke="url(#arrowUp)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Up arrow stem -->
  <line x1="30" y1="46" x2="30" y2="74" stroke="url(#arrowUp)" stroke-width="4" stroke-linecap="round"/>

  <!-- Down arrow (right of wheel) -->
  <path d="M86 68 L98 82 L110 68" fill="none" stroke="url(#arrowDown)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Down arrow stem -->
  <line x1="98" y1="82" x2="98" y2="54" stroke="url(#arrowDown)" stroke-width="4" stroke-linecap="round"/>
</svg>
