<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>shader previewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#09090b;
  color:#e4e4e7;
  font-family:system-ui,-apple-system,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:1rem
}
#app{
  width:min(1200px,100%);
  height:min(800px,90vh);
  display:flex;
  gap:1rem;
  background:#18181b;
  border:1px solid #27272a;
  border-radius:1rem;
  padding:1rem
}
#preview{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  min-width:0;
  position:relative
}
#preview canvas{
  display:block;
  border-radius:.5rem;
  background:#000;
  touch-action:none
}
#fs-btn{
  position:absolute;
  top:.5rem;
  right:.5rem;
  background:rgba(0,0,0,.55);
  color:#e4e4e7;
  border:1px solid rgba(255,255,255,.15);
  border-radius:.375rem;
  padding:.35rem .6rem;
  font-size:.8rem;
  cursor:pointer;
  backdrop-filter:blur(4px);
  transition:background .15s;
  touch-action:manipulation;
  z-index:2;
  line-height:1
}
#fs-btn:hover{background:rgba(0,0,0,.8)}
#preview.fullscreen{
  position:fixed;
  top:0;
  right:0;
  bottom:0;
  left:0;
  z-index:9999;
  background:#000
}
#preview.fullscreen canvas{border-radius:0}
#preview.fullscreen #fs-btn{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3)}
#zoom-indicator{
  position:absolute;
  bottom:.5rem;
  left:.5rem;
  background:rgba(0,0,0,.55);
  color:#e4e4e7;
  border:1px solid rgba(255,255,255,.15);
  border-radius:.375rem;
  padding:.25rem .5rem;
  font-size:.75rem;
  backdrop-filter:blur(4px);
  display:none;
  pointer-events:none;
  z-index:2;
  line-height:1
}
#zoom-indicator.show{display:block}
#panel{
  width:420px;
  display:flex;
  flex-direction:column;
  gap:.5rem;
  min-width:0
}
#panel-header{
  display:flex;
  gap:.5rem;
  align-items:center;
  flex-wrap:wrap
}
.back-link{
  color:#52525b;
  text-decoration:none;
  font-size:.8rem;
  white-space:nowrap;
  transition:color .15s;
  padding:.25rem 0
}
.back-link:hover{color:#a1a1aa}
#panel-header select{
  flex:1;
  background:#09090b;
  color:#e4e4e7;
  border:1px solid #27272a;
  border-radius:.375rem;
  padding:.5rem .75rem;
  font-size:.875rem;
  cursor:pointer;
  font-family:system-ui,sans-serif;
  min-width:0;
  appearance:auto;
  -webkit-appearance:auto
}
#panel-header select:focus{outline:none;border-color:#6366f1}
#panel textarea{
  flex:1;
  background:#09090b;
  color:#e4e4e7;
  border:1px solid #27272a;
  border-radius:.5rem;
  padding:.75rem;
  font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace;
  font-size:13px;
  line-height:1.5;
  resize:none;
  tab-size:2;
  white-space:pre;
  overflow:auto
}
#panel textarea:focus{outline:none;border-color:#6366f1}
#toolbar{
  display:flex;
  gap:.5rem;
  align-items:center;
  flex-wrap:wrap
}
#toolbar button{
  background:#27272a;
  color:#e4e4e7;
  border:1px solid #3f3f46;
  border-radius:.375rem;
  padding:.5rem 1rem;
  font-size:.875rem;
  cursor:pointer;
  transition:background .15s,border-color .15s;
  touch-action:manipulation
}
#toolbar button:hover{background:#3f3f46;border-color:#52525b}
#toolbar button.primary{background:#6366f1;border-color:#6366f1}
#toolbar button.primary:hover{background:#818cf8}
#errors{
  background:#1a0a0a;
  border:1px solid #7f1d1d;
  border-radius:.375rem;
  padding:.5rem .75rem;
  font-family:monospace;
  font-size:12px;
  color:#fca5a5;
  min-height:2rem;
  max-height:6rem;
  overflow:auto;
  display:none;
  white-space:pre-wrap;
  word-break:break-all
}
#errors.show{display:block}
/* mobile */
@media(max-width:900px){
  body{padding:0;align-items:stretch}
  #app{
    flex-direction:column;
    height:100dvh;
    width:100%;
    border-radius:0;
    border:none;
    padding:.5rem;
    gap:.5rem
  }
  #preview{flex:0 0 40vh}
  #panel{width:100%;flex:1;min-height:0}
  #panel textarea{
    font-size:14px;
    min-height:100px
  }
  #toolbar button{
    padding:.6rem 1rem;
    font-size:1rem;
    min-height:44px
  }
  #panel-header select{
    font-size:1rem;
    padding:.6rem .75rem;
    min-height:44px
  }
}
/* --- annotation controls --- */
#annot-controls{
  display:none;
  flex-direction:column;
  gap:2px;
  max-height:160px;
  overflow-y:auto;
  border-top:1px solid #27272a;
  margin-top:2px
}
#annot-controls.show{display:flex}
.ctrl-group{
  display:flex;
  align-items:center;
  gap:.5rem;
  padding:3px 6px;
  font-size:.75rem;
  min-height:26px
}
.ctrl-group label{
  color:#a1a1aa;
  min-width:72px;
  flex-shrink:0;
  font-family:monospace;
  font-size:.7rem;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.ctrl-group input[type="range"]{
  flex:1;
  accent-color:#6366f1;
  height:4px;
  min-width:0
}
.ctrl-group .ctrl-value{
  color:#e4e4e7;
  min-width:36px;
  text-align:right;
  font-family:monospace;
  font-size:.65rem
}
.ctrl-group input[type="color"]{
  width:30px;
  height:24px;
  border:1px solid #3f3f46;
  border-radius:3px;
  padding:0;
  background:none;
  cursor:pointer
}
.ctrl-group input[type="checkbox"]{
  accent-color:#6366f1;
  width:15px;
  height:15px;
  cursor:pointer
}
.ctrl-group select{
  background:#09090b;
  color:#e4e4e7;
  border:1px solid #27272a;
  border-radius:3px;
  padding:2px 6px;
  font-size:.7rem;
  font-family:monospace;
  flex:1;
  min-width:0
}
.anim-btn{
  background:none;
  border:1px solid #3f3f46;
  color:#a1a1aa;
  border-radius:3px;
  cursor:pointer;
  font-size:.65rem;
  padding:1px 5px;
  line-height:1.3;
  transition:color .15s,border-color .15s
}
.anim-btn:hover{
  color:#e4e4e7;
  border-color:#6366f1
}
.anim-btn[data-playing="true"]{
  color:#6366f1;
  border-color:#6366f1
}
select.curve-select{
  background:#09090b;
  color:#a1a1aa;
  border:1px solid #3f3f46;
  border-radius:3px;
  font-size:.6rem;
  padding:1px 2px;
  cursor:pointer;
  max-width:80px
}
#time-control{
  display:none;
  align-items:center;
  gap:.5rem;
  padding:.35rem .75rem;
  border-bottom:1px solid #27272a;
  font-size:.7rem;
  color:#a1a1aa;
  flex-shrink:0
}
#time-control.show{display:flex}
#time-control label{min-width:32px}
#time-speed-label{
  min-width:90px;
  text-align:center;
  font-family:monospace
}
.warp-btn{
  background:transparent;
  color:#a1a1aa;
  border:1px solid #3f3f46;
  border-radius:4px;
  cursor:pointer;
  font-size:.75rem;
  padding:1px 8px;
  line-height:1.5;
  transition:color .15s,border-color .15s
}
.warp-btn:hover{color:#e4e4e7;border-color:#6366f1}
.warp-btn:active{background:#27272a}
</style>
</head>
<body>
<div id="app">
  <div id="preview">
    <canvas id="c"></canvas>
    <button id="fs-btn">⛶</button>
    <div id="zoom-indicator"></div>
  </div>
  <div id="panel">
    <div id="panel-header">
      <select id="shader-select"></select>
    </div>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    <div id="toolbar">
      <button class="primary" id="compile">Compile</button>
      <button id="reset">Reset</button>
      <span style="flex:1"></span>
      <a class="back-link" href="/apps/">← back</a>
    </div>
    <div id="time-control">
      <label>Time</label>
      <button id="time-down" class="warp-btn">◀</button>
      <span id="time-speed-label">1×</span>
      <button id="time-up" class="warp-btn">▶</button>
    </div>
    <div id="annot-controls"></div>
    <div id="errors"></div>
  </div>
</div>
<script>
let SHADERS = {};
let shaderOrder = [];
let warpLevel = 0;
let timeSpeed = 1;
var userShaders = {};

function loadUserShaders(){
  userShaders = {};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k.indexOf('shader_user_')===0){
      try{
        var d=JSON.parse(localStorage.getItem(k));
        var name=k.slice(12);
        userShaders[name]={label:d.label||name,type:d.type||'2d',src:d.src};
        SHADERS['_user_'+name]={label:d.label||name,type:d.type||'2d',src:d.src};
      }catch(e){}
    }
  }
}

function saveUserShader(name,label,src){
  var type='2d';
  if(/\beye\b|\bscene\(\b|\bnorm\(\b/.test(src))type='3d';
  var data={label:label||name,type:type,src:src,created:new Date().toISOString()};
  localStorage.setItem('shader_user_'+name,JSON.stringify(data));
  userShaders[name]={label:data.label,type:data.type,src:data.src};
  SHADERS['_user_'+name]={label:data.label,type:data.type,src:data.src};
}

function cloneShader(){
  var name=prompt('Name for cloned shader:');
  if(!name||!name.trim())return;
  name=name.trim();
  if(name.indexOf('_user_')===0)name=name.slice(6);
  saveUserShader(name,name,code.value);
  populateSelect();
  select.value='_user_'+name;
  loadShader('_user_'+name);
}

async function loadShadersJSON() {
  const resp = await fetch('shaders.json');
  const data = await resp.json();
  shaderOrder = data._order || [];
  delete data._order;
  SHADERS = data;
  loadUserShaders();
  populateSelect();
  // Load default shader
  if (shaderOrder.length > 0) {
    loadShader(shaderOrder[0]);
  }
}
function populateSelect() {
  select.innerHTML = '';
  shaderOrder.forEach(function(id){
    var entry=SHADERS[id];
    if(!entry)return;
    var opt=document.createElement('option');
    opt.value=id;
    opt.textContent=entry.label||id;
    select.appendChild(opt);
  });
  // separator + user shaders
  var ukeys=Object.keys(userShaders);
  if(ukeys.length){
    var sep=document.createElement('option');
    sep.disabled=true;sep.textContent='\u2500\u2500\u2500 user \u2500\u2500\u2500';
    select.appendChild(sep);
    ukeys.forEach(function(name){
      var opt=document.createElement('option');
      opt.value='_user_'+name;
      opt.textContent=userShaders[name].label||name;
      select.appendChild(opt);
    });
  }
  var clone=document.createElement('option');
  clone.value='__clone__';
  clone.textContent='\u271a Clone & rename...';
  select.appendChild(clone);
}
function isShader3D(name) {
  return SHADERS[name]?.type === '3d';
}
// --- setup ---
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:true});
if(gl)gl.drawingBufferColorSpace='display-p3';
if(!gl){document.getElementById('app').innerHTML='<div style="color:red;padding:2rem;width:100%;text-align:center">WebGL2 not supported</div>';}
let W, H;
function resize(){
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio||1;
  const w = Math.floor(rect.width);
  const h = Math.floor(rect.height);
  if(w===Math.round(W/dpr)&&h===Math.round(H/dpr))return;
  W = w*dpr;
  H = h*dpr;
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = w+'px';
  canvas.style.height = h+'px';
  gl.viewport(0,0,W,H);
}
new ResizeObserver(resize).observe(canvas.parentElement);
window.addEventListener('resize', resize);
resize();
// --- vertex shader ---
const VS_SRC = `#version 300 es\nin vec2 p;\nvoid main(){gl_Position=vec4(p,0,1);}`;
const vs = gl.createShader(gl.VERTEX_SHADER);
gl.shaderSource(vs, VS_SRC);
gl.compileShader(vs);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
function createProgram(fsSrc){
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, fsSrc);
  gl.compileShader(fs);
  if(!gl.getShaderParameter(fs, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(fs);
    gl.deleteShader(fs);
    throw new Error(log);
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    const log = gl.getProgramInfoLog(prog);
    gl.deleteProgram(prog);
    gl.deleteShader(fs);
    throw new Error(log);
  }
  gl.deleteShader(fs);
  return prog;
}
let curProg = null;
let uR=null, uT=null, uEye=null, uTarget=null, uPan=null, uZoom=null;
let aP = null;
function useProgram(prog){
  curProg=prog; gl.useProgram(prog);
  aP=gl.getAttribLocation(prog,'p');
  gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
  gl.enableVertexAttribArray(aP);
  uR=gl.getUniformLocation(prog,'r');
  uT=gl.getUniformLocation(prog,'t');
  uEye=gl.getUniformLocation(prog,'eye');
  uTarget=gl.getUniformLocation(prog,'target');
  uPan=gl.getUniformLocation(prog,'pan');
  uZoom=gl.getUniformLocation(prog,'zoom');
}
function compileShader(src){
  try{
    const prog = createProgram(src||code.value);
    if(curProg)gl.deleteProgram(curProg);
    useProgram(prog);
    buildControls();
    errEl.classList.remove('show');
  }catch(e){
    errEl.textContent = e.message;
    errEl.classList.add('show');
  }
}
// --- shader type detection ---
// --- orbital camera (3D shaders) ---
let theta=0, phi=.6, dist=7;
let targetPos = [0,1.2,0];
// --- pan/zoom state (2D fractal shaders) ---
let panX = 0, panY = 0, zoomLevel = 1;
// --- interaction ---
let mx=0, my=0, down=false;
canvas.addEventListener('pointerdown',e=>{
  down=true; mx=e.clientX; my=e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(!down||isPinching)return;
  const dx=e.clientX-mx, dy=e.clientY-my;
  mx=e.clientX; my=e.clientY;
  if(isShader3D(select.value)){
    theta-=dx*.008;
    phi=Math.max(.1,Math.min(Math.PI/2-.1,phi+dy*.008));
  } else {
    const scale = 6.0 / zoomLevel / H;
    panX -= dx * scale;
    panY += dy * scale;
  }
});
canvas.addEventListener('pointerup',()=>{down=false;});
canvas.addEventListener('pointercancel',()=>{down=false;});
// smooth zoom via exp() — consistent on mice & trackpads
canvas.addEventListener('wheel',e=>{
  const k=.002;
  if(isShader3D(select.value)){
    dist=Math.max(2,Math.min(20,dist*Math.exp(e.deltaY*k)));
  }else{
    zoomLevel*=Math.exp(-e.deltaY*k);
  }
  e.preventDefault();
},{passive:false});
// double-click to reset pan/zoom on fractals
canvas.addEventListener('dblclick',()=>{
  if(isShader3D(select.value)){
    theta=0; phi=.6; dist=7;
  }else{
    panX=0; panY=0; zoomLevel=1;
  }
});
// --- pinch-to-zoom on mobile (base-state reference for smooth zoom) ---
let isPinching=false, prevPinchDist=0;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    prevPinchDist=Math.sqrt(dx*dx+dy*dy);
    isPinching=true;
  }
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const cur=Math.sqrt(dx*dx+dy*dy);
    if(prevPinchDist>0){
      const ratio=cur/prevPinchDist;
      if(isShader3D(select.value)){
        dist=Math.max(2,dist/ratio);
      } else {
        zoomLevel*=ratio;
      }
      prevPinchDist=cur;
    }
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(e.touches.length<2){isPinching=false;prevPinchDist=0;}
});
// --- annotation UI controls ---
// Parse uniform annotations like: uniform float u_x; // @slider 0.0 1.0 0.5
// Extracts type, name, annotation type, and parameters from each annotated uniform.
function parseAnnotations(src) {
  const controls = [];
  const re = /uniform\s+(float|int|bool|vec[234])\s+(\w+)\s*;\s*\/\/\s*@(slider|intslider|color|toggle|dropdown)\s*(.*)$/gm;
  let m;
  while ((m = re.exec(src)) !== null) {
    controls.push({
      glslType: m[1],
      name: m[2],
      annotType: m[3],
      params: m[4].trim()
    });
  }
  return controls;
}
// Stores { name, glslType, loc, annotType, element, getValue } for each active control
let annotControls = [];
function clearControls() {
  const container = document.getElementById('annot-controls');
  if (container) container.innerHTML = '';
  annotControls = [];
}
// Build DOM controls from annotations in the current shader source
function buildControls() {
  clearControls();
  if (!curProg) return;
  const container = document.getElementById('annot-controls');
  const parsed = parseAnnotations(code.value);
  if (!parsed.length) { container.classList.remove('show'); return; }
  container.classList.add('show');
  parsed.forEach(info => {
    const loc = gl.getUniformLocation(curProg, info.name);
    if (loc === null) return; // uniform may be optimized out
    const group = document.createElement('div');
    group.className = 'ctrl-group';
    const label = document.createElement('label');
    label.textContent = info.name;
    group.appendChild(label);
    const ctrl = { name: info.name, glslType: info.glslType, loc, annotType: info.annotType, element: null, getValue: null };
    switch (info.annotType) {
      case 'slider': {
        const parts = info.params.split(/\s+/).map(Number);
        const mn = parts[0] || 0;
        const mx = parts[1] || 1;
        const def = parts[2] !== undefined ? parts[2] : (mn + mx) / 2;
        const input = document.createElement('input');
        input.type = 'range';
        input.min = mn;
        input.max = mx;
        input.step = 'any';
        input.value = def;
        const valSpan = document.createElement('span');
        valSpan.className = 'ctrl-value';
        valSpan.textContent = Number(def).toFixed(3);
        const animBtn = document.createElement('button');
        animBtn.className = 'anim-btn';
        animBtn.textContent = '▶';
        animBtn.dataset.playing = 'false';
        input.addEventListener('input', () => {
          if (ctrl.animating) {
            ctrl.animating = false;
            animBtn.textContent = '▶';
            animBtn.dataset.playing = 'false';
          }
          valSpan.textContent = parseFloat(input.value).toFixed(3);
        });
        animBtn.addEventListener('click', () => {
          ctrl.animating = !ctrl.animating;
          if(ctrl.animating){
            ctrl.startTime = (performance.now()-start)/1000;
            var norm = (parseFloat(ctrl.element.value) - ctrl.min) / (ctrl.max - ctrl.min);
            switch(ctrl.curve){
              case'saw':ctrl.phaseOffset=norm*2*Math.PI;break;
              case'triangle':ctrl.phaseOffset=norm*Math.PI;break;
              default:ctrl.phaseOffset=Math.asin(2*norm-1);
            }
          }
          animBtn.textContent = ctrl.animating ? '⏸' : '▶';
          animBtn.dataset.playing = ctrl.animating ? 'true' : 'false';
        });
        input.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Spacebar'||e.keyCode===32){e.preventDefault();animBtn.click();}});
        group.appendChild(input);
        group.appendChild(valSpan);
        group.appendChild(animBtn);
        const curveSel = document.createElement('select');
        curveSel.className = 'curve-select';
        ['↻ sine','↗ saw','↕ triangle'].forEach(function(c){const o=document.createElement('option');o.textContent=c;o.value=c.split(' ')[1];curveSel.appendChild(o)});
        curveSel.value='sine';
        curveSel.onchange=function(){ctrl.curve=this.value};
        group.appendChild(curveSel);
        ctrl.element = input;
        ctrl.getValue = () => parseFloat(input.value);
        ctrl.animating = false;
        ctrl.animBtn = animBtn;
        ctrl.curve = 'sine';
        ctrl.min = mn;
        ctrl.max = mx;
        break;
      }
      case 'intslider': {
        const parts = info.params.split(/\s+/).map(Number);
        const mn = parts[0] || 0;
        const mx = parts[1] || 100;
        const def = parts[2] !== undefined ? Math.round(parts[2]) : Math.floor((mn + mx) / 2);
        const input = document.createElement('input');
        input.type = 'range';
        input.min = mn;
        input.max = mx;
        input.step = 1;
        input.value = def;
        const valSpan = document.createElement('span');
        valSpan.className = 'ctrl-value';
        valSpan.textContent = Math.round(def);
        const animBtn = document.createElement('button');
        animBtn.className = 'anim-btn';
        animBtn.textContent = '▶';
        animBtn.dataset.playing = 'false';
        input.addEventListener('input', () => {
          if (ctrl.animating) {
            ctrl.animating = false;
            animBtn.textContent = '▶';
            animBtn.dataset.playing = 'false';
          }
          valSpan.textContent = Math.round(input.value);
        });
        animBtn.addEventListener('click', () => {
          ctrl.animating = !ctrl.animating;
          if(ctrl.animating){
            ctrl.startTime = (performance.now()-start)/1000;
            var norm = (parseFloat(ctrl.element.value) - ctrl.min) / (ctrl.max - ctrl.min);
            switch(ctrl.curve){
              case'saw':ctrl.phaseOffset=norm*2*Math.PI;break;
              case'triangle':ctrl.phaseOffset=norm*Math.PI;break;
              default:ctrl.phaseOffset=Math.asin(2*norm-1);
            }
          }
          animBtn.textContent = ctrl.animating ? '⏸' : '▶';
          animBtn.dataset.playing = ctrl.animating ? 'true' : 'false';
        });
        input.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Spacebar'||e.keyCode===32){e.preventDefault();animBtn.click();}});
        group.appendChild(input);
        group.appendChild(valSpan);
        group.appendChild(animBtn);
        const curveSel = document.createElement('select');
        curveSel.className = 'curve-select';
        ['↻ sine','↗ saw','↕ triangle'].forEach(function(c){const o=document.createElement('option');o.textContent=c;o.value=c.split(' ')[1];curveSel.appendChild(o)});
        curveSel.value='sine';
        curveSel.onchange=function(){ctrl.curve=this.value};
        group.appendChild(curveSel);
        ctrl.element = input;
        ctrl.getValue = () => Math.round(parseFloat(input.value));
        ctrl.animating = false;
        ctrl.animBtn = animBtn;
        ctrl.curve = 'sine';
        ctrl.min = mn;
        ctrl.max = mx;
        break;
      }
      case 'color': {
        const defaultHex = info.params || '#ffffff';
        const input = document.createElement('input');
        input.type = 'color';
        input.value = defaultHex;
        group.appendChild(input);
        ctrl.element = input;
        ctrl.getValue = () => {
          const hex = input.value;
          return [
            parseInt(hex.slice(1,3), 16) / 255,
            parseInt(hex.slice(3,5), 16) / 255,
            parseInt(hex.slice(5,7), 16) / 255
          ];
        };
        break;
      }
      case 'toggle': {
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = true;
        group.appendChild(input);
        ctrl.element = input;
        ctrl.getValue = () => input.checked ? 1 : 0;
        break;
      }
      case 'dropdown': {
        // Format: @dropdown val1,val2,val3 defaultIdx
        const lastSpace = info.params.lastIndexOf(' ');
        let valsStr, defaultIdx;
        if (lastSpace > 0) {
          valsStr = info.params.slice(0, lastSpace);
          defaultIdx = parseInt(info.params.slice(lastSpace + 1), 10) || 0;
        } else {
          valsStr = info.params;
          defaultIdx = 0;
        }
        const vals = valsStr.split(',').map(s => s.trim());
        const select = document.createElement('select');
        vals.forEach((v, i) => {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          if (i === defaultIdx) opt.selected = true;
          select.appendChild(opt);
        });
        group.appendChild(select);
        ctrl.element = select;
        ctrl.getValue = () => {
          const v = select.value;
          if (info.glslType === 'float') return parseFloat(v);
          if (info.glslType === 'int' || info.glslType === 'bool') return parseInt(v, 10);
          return v;
        };
        break;
      }
    }
    container.appendChild(group);
    annotControls.push(ctrl);
  });
}
// --- render loop ---
let start = performance.now();
let errEl = document.getElementById('errors');
let zoomEl = document.getElementById('zoom-indicator');
function frame(){
  const sec = (performance.now()-start)/1000;
  if(curProg && W>0 && H>0){
    if(uR)gl.uniform2f(uR,W,H);
    if(uT)gl.uniform1f(uT,sec*timeSpeed);
    if(uPan)gl.uniform2f(uPan,panX,panY);
    if(uZoom)gl.uniform1f(uZoom,zoomLevel);
    if(isShader3D(select.value)){
      const eye = [targetPos[0]+dist*Math.sin(theta)*Math.cos(phi),
                   targetPos[1]+dist*Math.sin(phi),
                   targetPos[2]+dist*Math.cos(theta)*Math.cos(phi)];
      if(uEye)gl.uniform3fv(uEye,eye);
      if(uTarget)gl.uniform3fv(uTarget,targetPos);
    }
    // Update animated slider values
    for (const ctrl of annotControls) {
      if (ctrl.animating && ctrl.min !== undefined && ctrl.max !== undefined) {
        const period = 8;
        var elapsed = (sec - ctrl.startTime) * timeSpeed;
        var phase = (elapsed / period) * Math.PI * 2 + (ctrl.phaseOffset||0);
        var t;
        switch(ctrl.curve){
          case'saw':t=(phase%(2*Math.PI))/(2*Math.PI);break;
          case'triangle':t=1-Math.abs(((phase%(2*Math.PI))/Math.PI)-1);break;
          default:t=(Math.sin(phase)+1)/2;
        }
        const val = ctrl.min + t * (ctrl.max - ctrl.min);
        ctrl.element.value = val;
        const valSpan = ctrl.element.parentElement.querySelector('.ctrl-value');
        if (valSpan) valSpan.textContent = ctrl.annotType === 'intslider'
          ? Math.round(val) : Number(val).toFixed(3);
      }
    }
    // annotation uniform controls: read values from DOM and upload to GPU
    for (const ctrl of annotControls) {
      const v = ctrl.getValue();
      switch (ctrl.glslType) {
        case 'float': gl.uniform1f(ctrl.loc, v); break;
        case 'int':   gl.uniform1i(ctrl.loc, v); break;
        case 'bool':  gl.uniform1i(ctrl.loc, v); break;
        case 'vec2':  if (Array.isArray(v)) gl.uniform2fv(ctrl.loc, v); break;
        case 'vec3':  if (Array.isArray(v)) gl.uniform3fv(ctrl.loc, v); break;
        case 'vec4':  if (Array.isArray(v)) gl.uniform4fv(ctrl.loc, v); break;
      }
    }
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    // zoom indicator for 2D fractals
    if(isShader3D(select.value)){
      zoomEl.classList.remove('show');
    } else {
      zoomEl.classList.add('show');
      zoomEl.textContent = zoomLevel>1e4
        ? 'Zoom: ' + zoomLevel.toExponential(1) + 'x'
        : 'Zoom: ' + zoomLevel.toFixed(1) + 'x';
    }
  }
  requestAnimationFrame(frame);
}
// --- DOM ---
const code = document.getElementById('code');
const select = document.getElementById('shader-select');
function loadShader(name){
  const src = SHADERS[name]?.src;
  if(!src)return;
  code.value = src;
  panX=0; panY=0; zoomLevel=1;
  theta=0; phi=.6; dist=7;
  if(name === 'julia-3d'){ targetPos = [0, 0, 0]; }
  else if(isShader3D(name)){ targetPos = [0, 1.2, 0]; }
  document.getElementById('time-control').classList.toggle('show', /\buniform\s+float\s+t\b/.test(src));
  compileShader(src);
}
select.addEventListener('change',function(){
  if(this.value==='__clone__'){cloneShader();return;}
  loadShader(this.value);
});
document.getElementById('compile').addEventListener('click',()=>compileShader());
document.getElementById('reset').addEventListener('click',()=>loadShader(select.value));
function fmtWarp(lvl){
  if(lvl===0)return '1×';
  var s=Math.pow(10,lvl);
  if(lvl<5)return s.toLocaleString()+'× slower';
  return s.toExponential(2)+'× slower';
}
document.getElementById('time-up').addEventListener('click',function(e){
  var step=e.shiftKey?5:1;
  warpLevel+=step;
  timeSpeed=1/Math.pow(10,warpLevel);
  document.getElementById('time-speed-label').textContent=fmtWarp(warpLevel);
});
document.getElementById('time-down').addEventListener('click',function(e){
  var step=e.shiftKey?5:1;
  warpLevel=Math.max(0,warpLevel-step);
  timeSpeed=1/Math.pow(10,warpLevel);
  document.getElementById('time-speed-label').textContent=fmtWarp(warpLevel);
});
code.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key==='Enter')compileShader();
});
// --- fullscreen (native API primary, CSS fallback when API unavailable) ---
const fsBtn = document.getElementById('fs-btn');
const preview = document.getElementById('preview');
let fsActive = false;
function setFS(on){
  fsActive = on;
  preview.classList.toggle('fullscreen', on);
  document.body.style.overflow = on ? 'hidden' : '';
  setTimeout(resize, 150);
}
function toggleFS(){
  if(document.fullscreenElement){
    document.exitFullscreen().catch(()=>setFS(false));
  }else{
    // iOS Safari: requestFullscreen may not exist on <div>, or promise hangs.
    // Guard existence, fall back to CSS after 300ms timeout.
    if(typeof preview.requestFullscreen !== 'function'){
      setFS(true);
      return;
    }
    preview.requestFullscreen().catch(()=>setFS(true));
    setTimeout(() => {
      if(!document.fullscreenElement && !fsActive) setFS(true);
    }, 300);
  }
}
fsBtn.addEventListener('click', toggleFS);
// CSS-only Escape handler — native fullscreen handles its own Escape
document.addEventListener('keydown', function fsKeydown(e){
  if(e.key === 'Escape' && fsActive && !document.fullscreenElement){
    setFS(false);
  }
});
document.addEventListener('fullscreenchange', ()=>{
  setFS(!!document.fullscreenElement);
});
// --- init ---
loadShadersJSON();
frame();
</script>
